name: Build, verify, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FIREBASE_PROJECT_ID: pablo-health-tracker
  FIREBASE_API_KEY: AIzaSyCPTWLNH4oNdqgUr1nr_XHnOD24GD7C_D8

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install

      - name: Build app
        run: |
          npm run build

      - name: Install Playwright browser
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Playwright browser install failed (attempt $attempt), retrying..."
            sleep 10
          done
          exit 1

      - name: Install firebase-tools
        run: |
          npm install -g firebase-tools

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Create disposable test account
        run: |
          TEST_EMAIL="ci-verify-${{ github.run_id }}@example.com"
          TEST_PASSWORD="Verify-${{ github.run_id }}-x9!"
          RESPONSE=$(curl -s -X POST \
            "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$FIREBASE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$TEST_EMAIL\",\"password\":\"$TEST_PASSWORD\",\"returnSecureToken\":true}")
          ID_TOKEN=$(echo "$RESPONSE" | jq -r '.idToken')
          TEST_UID=$(echo "$RESPONSE" | jq -r '.localId')
          if [ "$ID_TOKEN" = "null" ] || [ -z "$ID_TOKEN" ]; then
            echo "Failed to create disposable test account:"
            echo "$RESPONSE"
            exit 1
          fi
          echo "TEST_EMAIL=$TEST_EMAIL" >> "$GITHUB_ENV"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_UID=$TEST_UID" >> "$GITHUB_ENV"
          echo "TEST_ID_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"

      - name: Deploy preview channel
        run: |
          CHANNEL_ID="ci-${{ github.run_id }}"
          firebase hosting:channel:deploy "$CHANNEL_ID" \
            --expires 1h \
            --project "$FIREBASE_PROJECT_ID" \
            --json > channel-deploy.json
          cat channel-deploy.json
          PREVIEW_URL=$(jq -r '.result | to_entries[0].value.url' channel-deploy.json)
          if [ "$PREVIEW_URL" = "null" ] || [ -z "$PREVIEW_URL" ]; then
            echo "Failed to read preview URL from channel deploy output"
            exit 1
          fi
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"

      - name: Run end-to-end verification
        run: |
          node e2e/verify.mjs

      - name: Clean up disposable test account and data
        if: always()
        run: |
          if [ -n "$TEST_UID" ]; then
            firebase firestore:delete "users/$TEST_UID" \
              --recursive --force \
              --project "$FIREBASE_PROJECT_ID" || true
          fi
          if [ -n "$TEST_ID_TOKEN" ]; then
            curl -s -X POST \
              "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$FIREBASE_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"idToken\":\"$TEST_ID_TOKEN\"}" > /dev/null || true
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy-production:
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install firebase-tools
        run: |
          npm install -g firebase-tools

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Deploy to production
        run: |
          firebase deploy \
            --only hosting,firestore:rules \
            --project "$FIREBASE_PROJECT_ID"
